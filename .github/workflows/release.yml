name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.3.0-beta.0 or 0.3.0)
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease on the next dist-tag
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - run: npm ci

      - name: Resolve release mode
        run: |
          set -euo pipefail
          version_is_prerelease=false
          if [[ "${VERSION}" == *-* ]]; then
            version_is_prerelease=true
          fi

          if [[ "${{ inputs.prerelease }}" == "true" && "${version_is_prerelease}" != "true" ]]; then
            echo "prerelease=true requires a prerelease version string" >&2
            exit 1
          fi

          if [[ "${{ inputs.prerelease }}" != "true" && "${version_is_prerelease}" == "true" ]]; then
            echo "prerelease=false is incompatible with a prerelease version string" >&2
            exit 1
          fi

          if [[ "${{ inputs.prerelease }}" != "true" && "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
            echo "Stable releases must be dispatched from refs/heads/main" >&2
            exit 1
          fi

          if [[ "${version_is_prerelease}" == "true" ]]; then
            echo "DIST_TAG=next" >> "$GITHUB_ENV"
          else
            echo "DIST_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Set release version
        run: node scripts/sync-workspace-version.js "${VERSION}"

      - run: npm run build
      - run: npm test

      - name: Publish prerelease packages
        if: ${{ inputs.prerelease }}
        run: npm publish --workspaces --tag "${DIST_TAG}" --provenance --access public

      - name: Publish stable packages
        if: ${{ !inputs.prerelease }}
        run: npm publish --workspaces --tag "${DIST_TAG}" --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [ "${PRERELEASE}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "v${VERSION}" \
            --target "${TARGET_SHA}" \
            --title "v${VERSION}" \
            --generate-notes \
            ${prerelease_flag}

  sync-pr:
    needs: release
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set release version
        run: node scripts/sync-workspace-version.js "${VERSION}"

      - name: Open release sync PR
        shell: bash
        run: |
          set -euo pipefail

          branch="release-sync/v${VERSION}"
          pr_body_file="$(mktemp)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${branch}"
          git add \
            package.json \
            package-lock.json \
            packages/sapling-wasm/package.json \
            packages/sapling/Cargo.toml \
            Cargo.lock

          if git diff --cached --quiet; then
            echo "No release sync changes to commit."
            exit 0
          fi

          git commit -m "chore: sync repo after v${VERSION} release"
          git push --force-with-lease --set-upstream origin "${branch}"

          existing_pr="$(gh pr list --base main --head "${branch}" --json number --jq '.[0].number')"
          if [ -n "${existing_pr}" ]; then
            echo "PR #${existing_pr} already exists for ${branch}."
            exit 0
          fi

          cat > "${pr_body_file}" <<EOF
          Syncs repository metadata after publishing @taquito/sapling-wasm v${VERSION}.

          - updates root, workspace, lockfile, and Cargo crate versions
          EOF

          gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore: sync repo after v${VERSION} release" \
            --body-file "${pr_body_file}"
